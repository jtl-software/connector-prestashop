name: Build ZIP

on:
  workflow_run:
    workflows: [Check]
    types: [completed]

permissions:
  contents: read
  packages: read

jobs:
  build-zip:
    # Only build if Check workflow succeeded
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:8.3
      options: --user root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Build ZIP
        run: bash .github/scripts/build-zip.sh "${{ github.event.workflow_run.head_branch }}"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: jtl_connector_prestashop_${{ github.event.workflow_run.head_branch }}
          path: jtl_connector_prestashop_${{ github.event.workflow_run.head_branch }}.zip
          if-no-files-found: error
          retention-days: 90
