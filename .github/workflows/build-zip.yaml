name: Build ZIP

on:
  push:
    tags:
      - '*'

jobs:
  build-zip:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:8.3
      options: --user root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build ZIP
        run: bash .github/scripts/build-zip.sh "${{ github.ref_name }}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jtl_connector_prestashop_${{ github.ref_name }}
          path: jtl_connector_prestashop_${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 90
