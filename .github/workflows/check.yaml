name: Check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  status-check:
    name: status-check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:${{ matrix.php-version }}
      options: --user root
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Install dependencies
        run: bash .github/scripts/setup-check.sh

      - name: PHPCS
        if: always()
        run: bash .github/scripts/run-phpcs.sh

      - name: PHPStan
        if: always()
        run: composer run phpstan -- --error-format=github

      - name: PHPUnit
        if: always()
        run: composer run test
