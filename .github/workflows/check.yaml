name: Check

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  status-check:
    name: status-check (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:${{ matrix.php-version }}
      options: --user root
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Install dependencies
        run: bash .github/scripts/setup-check.sh

      - name: PHPCS
        if: always()
        run: bash .github/scripts/run-phpcs.sh

      - name: PHPStan
        if: always()
        run: composer run phpstan -- --error-format=github
