name: Check

on:
  push:
    tags:
      - '*'
    branches-ignore:
      - '**/gh-readonly-queue/**'

permissions:
  contents: read
  checks: write
  pull-requests: write
  packages: read

jobs:
  # Stage 1: Fast-fail lints (Actionlint, Shellcheck)
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
            
      - name: Lint GitHub Actions
        uses: reviewdog/action-actionlint@6fb7acc99f4a1008869fa8a0f09cfca740837d9d # v1.72.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          fail_level: error
          
      - name: Lint shell scripts
        uses: reviewdog/action-shellcheck@4c07458293ac342d477251099501a718ae5ef86e # v1.32.0
        with:
          reporter: ${{ github.event_name == 'pull_request' && 'github-pr-review' || 'github-check' }}
          path: .github/scripts
          pattern: '*.sh'
          fail_level: error

  # Stage 2: PHP static analysis (parallel)
  php-static-analysis:
    name: PHP Static Analysis (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      checks: write
      packages: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:${{ matrix.php-version }}
      options: --user root
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Install dependencies
        run: bash .github/scripts/setup-check.sh

      - name: PHPCS
        if: always()
        run: bash .github/scripts/run-phpcs.sh

      - name: PHPStan
        if: always()
        run: composer run phpstan -- --error-format=github

  # Stage 2b: PHP tests (parallel with static analysis)
  php-tests:
    name: PHP Tests (PHP ${{ matrix.php-version }})
    runs-on: ubuntu-latest
    needs: lint
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.1', '8.2', '8.3']
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:${{ matrix.php-version }}
      options: --user root
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Get Composer cache directory
        id: composer-cache-dir
        run: echo "dir=$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-composer-php${{ matrix.php-version }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-php${{ matrix.php-version }}-

      - name: Install dependencies
        run: bash .github/scripts/setup-check.sh

      - name: PHPUnit
        run: composer run test

  # Stage 3: Final status check (gates merging)
  check:
    name: Check status
    if: always()
    runs-on: ubuntu-latest
    needs: [lint, php-static-analysis, php-tests]
    permissions:
      checks: write
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        run: |
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.php-static-analysis.result }}" == "failure" ]] || \
             [[ "${{ needs.php-tests.result }}" == "failure" ]]; then
            echo "❌ One or more checks failed"
            exit 1
          fi
          echo "✅ All checks passed"

  build-zip:
    name: Build ZIP
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: check
    permissions:
      contents: read
      packages: read
    container:
      image: ghcr.io/jtl-software/connector-utils-ci-docker/php/cli:8.3
      options: --user root
    steps:
      - uses: actions/checkout@v6.0.2
        with:
          persist-credentials: false

      - name: Build ZIP
        run: bash .github/scripts/build-zip.sh "${{ github.ref_name }}"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: jtl_connector_prestashop_${{ github.ref_name }}
          path: jtl_connector_prestashop_${{ github.ref_name }}.zip
          if-no-files-found: error
          retention-days: 90
